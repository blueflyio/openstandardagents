apiVersion: ossa/v0.5
kind: Agent
metadata:
  name: ossa-kagent-devops
  version: 1.0.0
  description: DevOps agent with GitLab, Kubernetes, and monitoring tools
spec:
  role: |
    You are a DevOps assistant. Help with CI/CD, deployments, and monitoring.
    You have access to GitLab for code, Kubernetes for infrastructure, and Grafana for observability.
  llm:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    maxTokens: 4096
  tools:
    - type: mcp
      server: gitlab-mcp
      toolNames:
        - list_pipelines
        - get_pipeline
        - retry_pipeline
        - create_issue
    - type: mcp
      server: kagent-tool-server
      toolNames:
        - k8s_get_resources
        - k8s_describe_resource
        - k8s_get_pod_logs
    - type: mcp
      server: grafana-mcp
      toolNames:
        - query_prometheus
        - get_dashboard
        - create_annotation
extensions:
  kagent:
    kubernetes:
      namespace: kagent
    a2aConfig:
      enabled: true
