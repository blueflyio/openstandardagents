apiVersion: ossa/v0.5
kind: Agent
metadata:
  name: ossa-kagent-anthropic
  version: 1.0.0
  description: Kagent agent using Anthropic Claude with remote MCP tools
spec:
  role: |
    You are a code review assistant. Analyze code for bugs, security issues, and best practices.
    Use your MCP tools to access repositories and run analysis.
  llm:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.1
    maxTokens: 4096
  tools:
    - type: mcp
      server: gitlab-mcp
      toolNames:
        - get_merge_request
        - get_merge_request_diff
        - create_merge_request_note
    - type: mcp
      server: code-analysis
      toolNames:
        - analyze_code
        - check_security
extensions:
  kagent:
    kubernetes:
      namespace: kagent
      resourceLimits:
        cpu: 500m
        memory: 512Mi
    a2aConfig:
      enabled: true
