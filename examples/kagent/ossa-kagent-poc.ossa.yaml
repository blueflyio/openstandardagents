apiVersion: ossa/v0.5
kind: Agent
metadata:
  name: ossa-kagent-poc
  version: 1.0.0
  description: POC OpenStandardAgent for kagent.dev using built-in Kubernetes tools
spec:
  role: |
    You are a Kubernetes assistant. Use your tools to list and inspect cluster resources.
    Prefer read-only operations. Format responses in Markdown.
  llm:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.2
    maxTokens: 2048
  tools:
    - type: mcp
      server: kagent-tool-server
      toolNames:
        - k8s_get_resources
        - k8s_get_available_api_resources
        - k8s_describe_resource
        - k8s_get_pod_logs
extensions:
  kagent:
    kubernetes:
      namespace: kagent
      resourceLimits:
        cpu: 500m
        memory: 512Mi
    a2aConfig:
      enabled: true
