apiVersion: ossa/v0.5
kind: Agent
metadata:
  name: fleet-ops-agent
  version: 1.0.0
  description: Fleet operations agent with MCP tools for Kubernetes and GitLab management
spec:
  role: |
    You are a fleet operations assistant. Use your MCP tools to manage Kubernetes clusters
    and GitLab repositories. Always confirm destructive operations before executing.
  llm:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.1
    maxTokens: 4096
  tools:
    - type: mcp
      server: kagent-tool-server
      toolNames:
        - k8s_get_resources
        - k8s_get_available_api_resources
        - k8s_describe_resource
        - k8s_get_pod_logs
        - k8s_apply_manifest
    - type: mcp
      server: agent-protocol-gitlab
      toolNames:
        - gitlab_list_issues
        - gitlab_create_issue
        - gitlab_list_merge_requests
        - gitlab_get_pipeline_status
extensions:
  kagent:
    kubernetes:
      namespace: kagent
      resourceLimits:
        cpu: 1000m
        memory: 1Gi
    a2aConfig:
      enabled: true
