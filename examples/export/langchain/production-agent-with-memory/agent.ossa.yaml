apiVersion: ossa/v0.5
kind: Agent
metadata:
  name: production-agent-with-memory
  version: 1.0.0
  description: |
    Production-ready agent with advanced memory features showcasing v0.4.1:
    - Conversation buffer with window management
    - Conversation summary with token limits
    - Entity memory for entity tracking
    - Redis persistence for multi-instance deployments
    - PostgreSQL persistence for analytics and compliance
  labels:
    platform: langchain
    export: langchain
    use-case: production-showcase
    tier: production
    version: v0.4.1
spec:
  role: |
    You are a production assistant with advanced memory capabilities.
    You maintain conversation context across sessions and track entities.
  llm:
    provider: openai
    model: gpt-4o
    temperature: 0.7
    maxTokens: 2000
  memory:
    enabled: true
    type: conversation_buffer
    window_size: 20
    max_token_limit: 4000
    return_messages: true
    persistence:
      enabled: true
      backend: redis
      ttl: 86400
      connection:
        url: ${REDIS_URL}
        pool_size: 10
        timeout: 30
  tools:
    - type: function
      name: remember_fact
      description: Remember an important fact
      parameters:
        type: object
        properties:
          fact:
            type: string
            description: Fact to remember
        required:
          - fact
    - type: function
      name: recall_conversation
      description: Recall previous conversation
      parameters:
        type: object
        properties:
          query:
            type: string
            description: What to recall
        required:
          - query
  autonomy:
    level: supervised
    approval_required: false
  observability:
    logging:
      level: info
      format: json
    metrics:
      enabled: true
    tracing:
      enabled: true
      provider: opentelemetry
extensions:
  langchain:
    enabled: true
    chain_type: agent
    memory:
      type: buffer
    tools:
      - name: remember_fact
        description: Remember an important fact
      - name: recall_conversation
        description: Recall previous conversation
