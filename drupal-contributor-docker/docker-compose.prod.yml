version: 3.8
services:
  drupal-contributor:
    image: drupal-contributor:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
    networks:
      - agent-network
    restart: unless-stopped
    depends_on:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: 1.0
          memory: 512M
        reservations:
          cpus: 0.5
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test:
        - CMD-SHELL
        - node scripts/healthcheck.mjs
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - redis-data:/data
    networks:
      - agent-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  agent-network:
    driver: bridge
volumes:
  postgres-data:
  redis-data:
